name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Fix wrapper and keystore
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt || true
          mkdir -p app
          cp ~/.android/debug.keystore app/debug.keystore || true
          cp ~/.android/debug.keystore debug.keystore || true

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --info
        continue-on-error: false

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Focusguad-APK
          path: app/build/outputs/apk/debug/*.apk